openapi: 3.0.0
info:
  title: Responses
  version: "1.0.0"
  description: >
    Responses that are not a 200 with a JSON object: no content, an array
    at the root, a bare scalar, and an error shape. Each is a place a
    tester can assume more structure than the document promised.

paths:
  /empty:
    delete:
      summary: No content
      responses:
        "204":
          description: Deleted with no body

  /list:
    get:
      summary: An array at the root
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items: {type: string, minLength: 2}

  /count:
    get:
      summary: A bare number at the root
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: integer, minimum: 1}

  /flag:
    get:
      summary: A bare boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: boolean}

  /maybe:
    get:
      summary: A nullable object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                nullable: true
                required: [id]
                properties:
                  id: {type: integer, minimum: 1}
