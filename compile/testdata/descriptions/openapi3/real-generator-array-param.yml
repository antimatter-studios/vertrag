  "info": {
    "title": "inPACE (real generator output, plus one array query parameter)",
    "version": "dev",
    "description": "A go-oapifly-generated OpenAPI 3 document from a real project, unchanged except for one array-typed query parameter with a list example on GET /api/v1/card-reader/download. It pins the fix in #17: a list example used to be dropped by the parser and the parameter with it; the spec default for a query list is exploded, so the compiled URI must carry ids=1&ids=2."
  },
  "openapi": "3.0.0",
  "paths": {
    "/api/v1/auth/login": {
      "post": {
        "summary": "Login",
        "description": "Authenticates a user and creates a session",
        "tags": [
          "auth"
        ],
        "requestBody": {
          "description": "Login credentials",
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/restclient.LoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/restclient.LoginResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request format",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/restclient.ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Invalid username or password",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/restclient.ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "Error setting up session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/restclient.ErrorResponse"
                }
              }
            }
          }
        }
      }
