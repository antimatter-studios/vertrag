# vertrag.yml — every setting, with the reasoning.
#
# Copy the parts you need. Nothing here is required except the description and
# the endpoint, and both of those can come from the command line instead.

# --- What to test ------------------------------------------------------------

spec: ./openapi.json               # the API description: OpenAPI 2 or 3
endpoint: http://localhost:4000    # the server under test

# --- Which transactions ------------------------------------------------------

# A transaction is one documented request/response pair, named
# "<path> > <operation> > <status> > <content-type>". That name is how every
# setting below addresses one.
only: []                           # run only these, by name
method: []                         # run only these methods: GET, POST, …
tag: []                            # run only operations carrying one of these tags
operation-id: []                   # run only these operationIds

# A generated name is long and changes whenever somebody edits a summary, so
# whole families of them are addressed by pattern instead. The pattern is
# searched for in the name rather than compared with all of it, so a word is
# enough; anchor it with ^ and $ when you mean the entire name.
only-matching: ['^/api/v1/']

# The counterparts, which drop what they match. An include cannot say
# "everything except this" — expressing it as an include means listing every
# operation you do want and then keeping that list correct as the description
# grows, which nobody does, so the list rots and the run quietly stops covering
# what was added.
exclude: []                        # by name
exclude-matching: ['> 500 >']      # by pattern
exclude-method: [TRACE]            # by method
exclude-tag: [destructive]         # by tag
exclude-operation-id: []           # by operationId

# An exclude wins over every include, because the two are meant to be written
# together and the exclude is the more specific half of the pair. A pattern that
# does not compile stops the run and names itself, rather than becoming a filter
# that matches nothing — an include matching nothing tests an API that looks
# like it has nothing to test, and an exclude matching nothing sends every
# request it was written to prevent.

# Transactions to leave out of the run. The reason is optional and worth
# giving: it is printed with the skip, so a report says why forty transactions
# did not run rather than only that they did not. A skip list is where a
# suite's debt collects, and one that states its reasons is one somebody can
# eventually work through.
skip:
  - name: '/api/v1/jobs/{id} > Get job > 200 > application/json'
    reason: sends a literal "id" that fails integer parsing; covered by unit tests
  - '/api/v1/unstable > Unstable > 200 > application/json'

# An entry matching no transaction is reported rather than ignored — it usually
# means something was renamed, and the entry now protects nothing while still
# reading like a decision somebody made.

# --- What to send ------------------------------------------------------------

# Headers. A plain string goes on every request; an entry with `when` reaches
# only the transactions it matches.
header:
  - 'X-Trace: on'

  # The case the conditional form is really for: telling a mock which failure to
  # simulate, so the error responses the description promises can be reached at
  # all. Which failure to ask for follows from which response is expected.
  - name: X-Mock-Scenario
    value: absent
    when: {status: 404}
  - name: X-Mock-Scenario
    value: broken
    when: {status: 500}

# `when` also takes `method`. Nothing may look at the response: the conditions
# are properties the description already fixed, decided before the request is
# sent. A rule that needs to see what came back is a hook.

# Authentication: log in once, keep what came back, send it on everything
# afterwards. Nearly every suite needs this and almost none of it is specific to
# a project, which is why it is three lines of configuration and not a file of
# code with a language runtime behind it.
auth:
  login:
    path: /api/v1/auth/login    # method defaults to POST
    body: {username: admin, password: secret}

  # How the credential comes back. Naming a cookie implies `carry: cookie`, and
  # names which one to keep when the server sets several.
  cookie: jwt_token

  # Or take it from the response body. The value is a runtime expression — the
  # same language OpenAPI links use — so a token somewhere other than /token
  # needs no new setting:
  #   header: 'Authorization: Bearer {$response.body#/data/access_token}'
  # A static API key needs no `login` block at all:
  #   header: 'X-API-Key: abc123'

  # Transactions that must go out unauthenticated. A login endpoint documenting
  # its own 401 cannot produce one while holding a valid credential.
  except:
    - '/api/v1/auth/login > Login > 401 > application/json'

# --- Hooks -------------------------------------------------------------------

# For setup and teardown that genuinely varies by project — anything reacting to
# a response, or deriving a value per transaction. Everything above exists so
# that a hook file holds only what is actually specific to your API.
hookfiles: ./hooks.js

# The language your hook files are written in: `nodejs` (the default) or
# `python`. Both expose the same API and are tested against each other, so a
# hook behaves identically in either. Python uses only the standard library —
# no virtualenv, no pip install — and needs `python3` on PATH. Node hook files
# may be TypeScript if the project has tsx or ts-node.
language: nodejs

hooks-worker-handler-host: 127.0.0.1
hooks-worker-handler-port: 61321
hooks-worker-timeout: 5000

# --- What to check -----------------------------------------------------------

# These are on by default. Findings from them are labelled in the report, so
# they can be told apart from ordinary contract failures at a glance.
checks:
  # A 5xx means the server broke, which is worth saying plainly rather than
  # reporting as a status mismatch like any other.
  server-error: true

  # A response carrying a media type the description never promised. Checking a
  # declared header is present says nothing about whether its value is right.
  content-type: true

  # The exception to "on by default". This validates a response header's value
  # against the JSON Schema the description gave it — so an X-Rate-Limit
  # documented as a non-negative integer fails when the server answers `banana`.
  # Header schemas have never been enforced by anything, so a description is
  # quite likely to carry one that was never true, and switching this on unasked
  # would turn a working suite red for reasons that predate it. Turn it on when
  # you are ready to read what it finds; `--check-header-schema` does the same
  # for a single run.
  header-schema: false

  # How long a transaction may take before it is reported. This is the one check
  # the description cannot ask for: OpenAPI has no way to write "this endpoint
  # answers within 750ms", so the number can only come from you, and there is no
  # default — a bound vertrag invented would be green on the machine that
  # mattered and red on somebody's laptop. Written as a Go duration so the unit
  # is never a guess; no key at all, or 0, times nothing.
  #
  # Measured over the whole transaction, which is why it does not mix with
  # `transport.delay`: a run pausing between requests to spare a throttled
  # server spends that pause against the bound it is then judged by.
  max-response-time: 750ms

# --- Probing phases ----------------------------------------------------------

# `coverage` and `fuzz` generate request bodies and parameters rather than
# sending only what the description shows. That is the point of them, and it is
# also why this section exists: generation is only safe against an API where
# every endpoint is safe, and that is not the API most people have.
fuzz:
  seed: 0                          # 0 picks one and prints it; set it to replay
  cases: 50                        # distinct values per body and per parameter

  # pin holds a generated body field at a fixed value, in every request both
  # probing phases send. It is a safety interlock, not a generation hint.
  #
  # The case for it in one sentence: a trading API documents `POST /orders` with
  # a `dry_run` flag, the schema permits false, so generation draws false, and
  # the probe meant to test input handling places a real order. Nothing in
  # OpenAPI marks that field as the one that matters.
  #
  # A pin naming a field no request body in the description declares STOPS THE
  # RUN. A typo here would otherwise leave a configuration that reads exactly
  # like a safety control and holds nothing. The run also reports how many
  # bodies each pin held, because "configured" and "engaged" are different
  # facts and only the second one is safety.
  #
  # It holds a field the body already has; it never invents one. The `examples`
  # phase is not covered — that sends the description's own example, unchanged.
  # pin:
  #   dry_run: true

  # accept lists statuses that are not findings.
  #
  # A description does not carry business rules, so a generated body can satisfy
  # every documented constraint and still be refused — insufficient funds, a
  # closed market, an idempotency key already used. Reporting that as "the
  # server disagrees with its description" is true and useless.
  #
  # Every excused answer is COUNTED, and the run prints the count. That is the
  # condition on which this is worth offering at all: a suite that quietly
  # stopped testing anything then shows up as a number somebody can read,
  # rather than as a clean run. 5xx cannot be accepted — that is the server
  # breaking rather than refusing, and it is the finding these phases exist to
  # produce — and nor can anything under 400, which is not a rejection.
  # accept: [409, 422]

# --- Output ------------------------------------------------------------------

color: true
details: false                     # print passing exchanges too, not just failures
loglevel: warning

# Reporters pair with outputs by position, and an empty output means stdout — so
# this writes a readable log to the terminal AND a machine-readable file.
# Available: cli, dot, markdown, html, junit, har, vcr. The last two record the
# traffic rather than a verdict about it — a HAR file for devtools, a VCR
# cassette for a replay library. Credential headers are redacted in both;
# bodies are not, so a recording of a login still holds the password.
reporter: [cli, junit]
output: ["", report.xml]
