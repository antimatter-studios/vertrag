name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runs the differential against Dredd, which no longer runs per-commit. See
  # the `oracle` job for why.
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # The unit tests run without Node. The oracle suite skips itself when the
      # reference is absent, so this job stays honest about what it covered:
      # it is the `oracle` job below that proves agreement with Dredd.
      - run: go test ./...

      # A floor, not a target. It exists so the safety net that works without
      # Node cannot quietly rot while the oracle carries all the weight.
      - name: Enforce the coverage floor
        run: make cover

      # Publish the figure as well as enforcing it. A floor says the number has
      # not fallen below 70; it does not say what the number is, and a reader
      # deciding whether to trust this tool deserves to see it without cloning.
      #
      # Only on a push to main, and only from one Go version — three matrix jobs
      # racing to write the same file would publish whichever finished last.
      - name: Publish the coverage figure
        if: github.event_name == 'push' && matrix.go-version == '1.26'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          total="$(go tool cover -func=dist/coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')"

          # Shields' own thresholds would be arbitrary here; these match how the
          # project talks about coverage: the floor is 70, and 80 is where the
          # suite currently sits.
          colour=red
          awk "BEGIN{exit !($total >= 70)}" && colour=yellow
          awk "BEGIN{exit !($total >= 80)}" && colour=brightgreen

          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$total" "$colour" > /tmp/coverage.json

          # An orphan branch, not main. The badge has to live somewhere a raw
          # URL can reach, and committing a generated file back to main on every
          # push would put CI in the history and — since CI runs on pushes to
          # main — risk it triggering itself.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The branch is REPLACED on every publish, not appended to, so it
          # holds exactly one commit forever.
          #
          # It used to accumulate one commit per run — "coverage: 84.1%",
          # "coverage: 84.0%", "coverage: 83.9%" — and nothing ever read them.
          # The badge is served from the file at the tip, so the history was a
          # write-only log that made `git branch -a` and every branch listing
          # harder to read, growing for as long as the project does. A
          # generated artefact does not need a past.
          #
          # Force-pushing an orphan is safe precisely because it is generated:
          # nothing branches from here, nothing merges here, and the whole
          # content is rebuilt from the run that pushes it. The first publish
          # after this change squashes everything already there, so no separate
          # cleanup is needed.
          #
          # Nothing is published when the badge is ALREADY right — which means
          # both the number and the shape, not just the number.
          #
          # Asking only "has the coverage moved" was not enough, and the gap was
          # not hypothetical: this step was changed to keep the branch at one
          # commit while the branch already had thirty-nine, and a run whose
          # coverage happened to match would have skipped and left them there.
          # The history would then have collapsed on some unrelated future day,
          # or never. A step that maintains a state once reached, but cannot
          # reach it, is not a fix — it is a fix that has to be helped by hand,
          # and the hand is what this exists to remove.
          #
          # So the skip needs the file to match AND the tip to be a root commit.
          # Parents are counted out of the commit object rather than with
          # rev-list, because the fetch is shallow and rev-list would see the
          # grafted boundary rather than the truth.
          git fetch --depth=1 origin badges 2>/dev/null || true
          parents=$(git cat-file commit FETCH_HEAD 2>/dev/null | grep -c '^parent ' || true)
          if [ "${parents:-1}" = "0" ] \
            && git show FETCH_HEAD:coverage.json 2>/dev/null | diff -q - /tmp/coverage.json >/dev/null 2>&1; then
            echo "coverage is still ${total}% and the branch is already one commit; nothing to publish"
            exit 0
          fi

          # Built with plumbing rather than a checkout, so it cannot append.
          #
          # The obvious version — checkout --orphan, commit, force-push — has a
          # trap: --orphan refuses a branch name that already exists, and on a
          # reused checkout it then quietly COMMITS ONTO the leftover branch,
          # reproducing the accumulating history this is meant to remove. Adding
          # a `git branch -D` before it does not help either, because after the
          # first publish HEAD is standing on the branch being deleted. A
          # simulation of repeated runs caught both.
          #
          # commit-tree takes no parent unless one is given, so this is a single
          # rootless commit by construction — no branch name, no working tree,
          # no dependence on the state the runner arrived in. It also leaves the
          # checkout alone, which the old version disturbed with `git rm
          # --cached` and `rm -rf dist`.
          blob=$(git hash-object -w /tmp/coverage.json)
          tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "coverage: ${total}%")
          # Braced: `$commit:r` is a parameter modifier in zsh, which silently
          # eats the `:r` and pushes to a refspec that does not exist. Actions
          # runs bash, so this is belt and braces — but the simulation that
          # proved this step runs in zsh, and it bit there.
          git push --force origin "${commit}:refs/heads/badges"

  oracle:
    name: Differential test against Dredd
    # On demand, not on every commit. Dredd was the oracle while vertrag was
    # establishing that it read descriptions correctly, and it earned that place
    # — but agreeing with Dredd is no longer the definition of being right, and a
    # required job that says so shapes design decisions it should not.
    #
    # What it was protecting is now held by compile/testdata/golden, captured
    # while this differential passed over every fixture, so the verification is
    # carried forward rather than dropped. This stays runnable for when a second
    # opinion is actually wanted: run it from the Actions tab, or `make oracle`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Dredd is the oracle: the reference implementation is installed and run
      # for real, rather than its output being checked in. A behaviour change in
      # a new Dredd release therefore surfaces here as a failing diff instead of
      # silently becoming the expected answer.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: oracle/reference/package-lock.json

      - name: Install the reference implementation
        working-directory: oracle/reference
        # `npm ci`, not `npm install`: it installs exactly the tree the lockfile
        # records and fails if the lockfile and manifest disagree. Re-resolving
        # here would let a transitive dependency move the expectation vertrag is
        # being measured against.
        run: npm ci --no-audit --no-fund

      # -count=1 defeats the test cache: this suite's result depends on the
      # installed reference, which Go's cache does not know about.
      - name: Compare against the reference
        run: go test ./internal/oracle/... -count=1 -v

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

  # One always-run gate that main's branch protection requires by name. Jobs
  # above can be renamed, split into a matrix, made conditional or path-
  # filtered without ever stranding a merge — protection asks for "CI" and
  # only "CI". The oracle job is dispatch-only and skips on PRs; a skip is not
  # a failure here, deliberately.
  ci:
    name: CI
    needs: [test, oracle, formatting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed or was skipped
        run: |
          for r in '${{ needs.test.result }}' '${{ needs.oracle.result }}' '${{ needs.formatting.result }}'; do
            case "$r" in success|skipped) ;; *) echo "a required job ended as: $r" >&2; exit 1 ;; esac
          done
