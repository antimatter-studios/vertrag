openapi: "3.0.0"
info:
  title: Request Bodies
  version: "1.0.0"
paths:
  /typed:
    post:
      summary: Typed object body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                count:
                  type: integer
                active:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /explicit-example:
    post:
      summary: Body from an explicit example
      requestBody:
        content:
          application/json:
            example:
              name: given
              nested:
                deep: true
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: OK
  /named-examples:
    post:
      summary: Body from named examples
      requestBody:
        content:
          application/json:
            examples:
              first:
                value:
                  chosen: 1
              second:
                value:
                  ignored: 2
      responses:
        "200":
          description: OK
  /multiple-content-types:
    post:
      summary: Several request content types
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                a:
                  type: string
          text/plain:
            schema:
              type: string
              example: hello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
            text/plain:
              schema:
                type: string
                example: done
